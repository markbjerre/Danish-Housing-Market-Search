name: Test Scoring System

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: housing
          POSTGRES_PASSWORD: housing
          POSTGRES_DB: housing
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install npm dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo 'Waiting for PostgreSQL...'
            sleep 1
          done

      - name: Initialize database
        env:
          DATABASE_URL: postgresql://housing:housing@localhost:5432/housing
        run: |
          cd webapp
          python -c "from src.db_models_new import Base; from src.database import engine; Base.metadata.create_all(engine)"

      - name: Start Flask server
        env:
          DATABASE_URL: postgresql://housing:housing@localhost:5432/housing
          FLASK_ENV: testing
        run: |
          cd webapp
          python app.py &
          sleep 5

      - name: Run Playwright tests
        env:
          DATABASE_URL: postgresql://housing:housing@localhost:5432/housing
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-videos
          path: test-results/
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResults = fs.readFileSync('playwright-report/index.html', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Scoring system tests completed! View results in the Artifacts section or check the Playwright Report.'
            });

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Test Results
          path: 'test-results/results.json'
          reporter: 'java-junit'
          fail-on-error: 'false'
